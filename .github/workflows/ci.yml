name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint with ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check imports
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
import config; print('config OK')
from embedding import DCTEmbedder; print('embedding OK')
from extraction import DCTExtractor; print('extraction OK')
from error_correction import Hamming74; print('error_correction OK')
from baselines import LSBSteganography, DCTWithoutEC; print('baselines OK')
from robustness_tests import TransformationTester; print('robustness_tests OK')
from evaluation import MetricsCalculator; print('evaluation OK')
from steganalysis import Steganalysis; print('steganalysis OK')
"
